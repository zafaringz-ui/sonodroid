# WP-1 experiment, NOT the fix. Four questions, answered by building the real thing:
#   A. Does `rquickjs-sys`'s `bindgen` feature plus a per-target clang `--target` actually
#      compile `rquickjs-sys`, and therefore `music`, for the three Android ABIs?
#   B. Whose bindgen environment is right? cargo-ndk exports
#      `BINDGEN_EXTRA_CLANG_ARGS_<triple>` as `--sysroot=... -I...` with NO `--target=`,
#      in every released version (v3.5.4 through v4.1.2; the fix, commit ee7329a, is on
#      master only). Without `--target`, bindgen binds the HOST layout: for armv7 that
#      means 64-bit `size_t` and the 64-bit `JSValue` union, which is silently wrong.
#      This workflow builds armv7 twice — once with cargo-ndk's args, once with a
#      `--target=` added — and prints the generated shapes so the difference is visible.
#   C. Do the generated bindings differ per ABI, or can one layout serve all three?
#   D. Does the build reach aws-lc-sys / libsqlite3-sys / opusic-sys, which the first
#      WP-1 gate never got to because cargo stops at the first hard error?
#
# Nothing in `rust/` is edited. The `rquickjs-sys` whose build.rs is patched is the copy
# cargo extracted into the registry from crates.io; the `bindgen` feature is enabled from
# the command line. `--locked` is exercised first precisely to record that it fails, i.e.
# that this fix cannot land without a lockfile change.
#
# Everything is reported through annotations: job logs and artifacts cannot be read back
# from the authoring environment, so anything that is not an annotation is lost.
name: wp1-rquickjs-probe

on:
  push:
    branches: ["wp-1-rquickjs-fix"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_REVISION: "27.2.12479018"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
  NDK_SHA256: "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc"
  CARGO_NDK_VERSION: "3.5.4"
  # One API level for every ABI, so the clang target below is reproducible by hand.
  ANDROID_API: "21"
  # Be explicit about how git dependencies resolve: cargo-ndk replaces CC/CFLAGS/AR and
  # also unsets the credential helper for subprocesses, so libgit2 cannot authenticate.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup target list --installed | grep android

      - name: Install Android NDK r27c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk"
          archive="$RUNNER_TEMP/ndk/android-ndk-r27c-linux.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$NDK_URL"
          echo "${NDK_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          ndk_path="$RUNNER_TEMP/ndk/android-ndk-r27c"
          actual=$(sed -n 's/^Pkg\.Revision *= *//p' "$ndk_path/source.properties")
          echo "::notice title=ndk::Pkg.Revision=$actual"
          [ "$actual" = "$NDK_REVISION" ] || { echo "::error title=ndk::revision mismatch"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm clang libclang-dev pkg-config perl golang-go || true
          echo "libclang: $(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -n 3 | tr '\n' ' ')"
          echo "clang: $(clang --version | head -n 1)"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked || true
          cargo ndk --version || true

      - name: Fetch the locked dependency graph
        working-directory: rust
        run: |
          cargo fetch --locked 2>&1 | tail -n 3 || true
          ls -d "$HOME"/.cargo/registry/src/*/rquickjs-sys-0.12.2 > /tmp/rqjs-dir || true
          echo "::notice title=probe-rqjs-dir::$(cat /tmp/rqjs-dir 2>/dev/null || echo MISSING)"

      # A: recorded, expected to fail. If it passes, the fix needs no lockfile change at all.
      - name: "Q1 with --locked (expected: lockfile needs updating)"
        working-directory: rust
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a -p "$ANDROID_API" check \
               --features rquickjs-sys/bindgen -p music --locked > /tmp/locked.log 2>&1; then
            echo "::notice title=probe-locked::PASSED — bindgen deps are already in Cargo.lock"
          else
            body=$(grep -E '^(error|help|  )' /tmp/locked.log | head -n 12 | tr '\n' '%0A' | head -c 4000)
            echo "::error title=probe-locked::FAILED as expected ::$body"
          fi
          echo "::notice title=probe-locked-tail::$(tail -n 12 /tmp/locked.log | tr '\n' '%0A' | head -c 4000)"

      # Record exactly which packages the feature pulls in. This must actually compile:
      # the bindgen deps have to be *built* for the host, which is where libclang is used.
      - name: "Q2 what the bindgen feature adds to the graph"
        working-directory: rust
        run: |
          set -o pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          if cargo ndk -t arm64-v8a -p "$ANDROID_API" check \
               --features rquickjs-sys/bindgen -p music > /tmp/resolve.log 2>&1; then
            echo "::notice title=probe-resolve::compiled (aarch64, bindgen feature, no --locked)"
          else
            echo "::error title=probe-resolve::FAILED — see probe-resolve-tail"
          fi
          added=$(diff <(grep '^name = ' /tmp/Cargo.lock.before) <(grep '^name = ' Cargo.lock) \
                  | grep '^>' | sed 's/^> name = //' | tr -d '"' | sort -u | tr '\n' ' ')
          echo "::notice title=probe-lock-added::${added:-none}"
          echo "::notice title=probe-lock-diffstat::$(git diff --stat Cargo.lock | tr '\n' ' ')"
          tail=$(grep -E '^(error|warning: rquickjs|PROBE_TARGET)' /tmp/resolve.log | head -n 25 | tr '\n' '%0A' | head -c 6000)
          echo "::notice title=probe-resolve-notes::$tail"
          echo "::notice title=probe-resolve-tail::$(tail -n 20 /tmp/resolve.log | tr '\n' '%0A' | head -c 6000)"
          # Leave the lockfile dirty for the rest of the job (that mirrors the real fix) but
          # say so, so nobody thinks it was left dirty by accident.
          echo "::notice title=probe-lock-state::Cargo.lock left resolved for the builds below; repo state is unchanged"

      - name: Patch the registry copy of rquickjs-sys (probe only)
        run: |
          set -euo pipefail
          d=$(cat /tmp/rqjs-dir 2>/dev/null || true)
          [ -n "$d" ] || { echo "::error title=probe-patch::registry copy not found"; exit 0; }
          chmod -R u+w "$d"
          if python3 scripts/wp1-probe-rquickjs.py "$d/build.rs"; then
            echo "::notice title=probe-patch::patched $(basename "$d")"
          else
            echo "::error title=probe-patch::anchor not found — rquickjs-sys build.rs changed"
          fi
          echo "::notice title=probe-quickjs-src::$(ls "$d/quickjs" 2>/dev/null | head -n 6 | tr '\n' ' ')"

      # The per-ABI clang arguments the fix needs, spelled out. `--target` is the part
      # cargo-ndk leaves out; `--sysroot` and the arch include dir are what it does pass.
      - name: Compute bindgen clang args per ABI
        run: |
          set -euo pipefail
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "BINDGEN_ARGS_arm64=--target=aarch64-linux-android${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/aarch64-linux-android"
            echo "BINDGEN_ARGS_armv7=--target=armv7a-linux-androideabi${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/arm-linux-androideabi"
            echo "BINDGEN_ARGS_x86_64=--target=x86_64-linux-android${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/x86_64-linux-android"
            echo "BINDGEN_ARGS_armv7_notarget=--sysroot=${sysroot} -I${sysroot}/usr/include/arm-linux-androideabi"
          } >> "$GITHUB_ENV"
          cat "$GITHUB_ENV" | grep BINDGEN_ARGS

      # One ABI per step so a failure names its own ABI. `PROBE_HOST_BINDGEN` disables the
      # crate's host-vs-target clamp in the patched build.rs; the dump goes to /tmp/probe.
      - name: "music via bindgen (aarch64-linux-android)"
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: ${{ env.BINDGEN_ARGS_arm64 }}
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a -p "$ANDROID_API" check --features rquickjs-sys/bindgen -p music \
               > /tmp/aarch64.log 2>&1; then
            echo "::notice title=probe-aarch64::PASS"
          else
            echo "::error title=probe-aarch64::FAIL"
          fi
          echo "::notice title=probe-aarch64-shapes::$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/aarch64.log | head -n 30 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=probe-aarch64-tail::$(tail -n 20 /tmp/aarch64.log | tr '\n' '%0A' | head -c 6000)"

      - name: "music via bindgen (x86_64-linux-android)"
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android: ${{ env.BINDGEN_ARGS_x86_64 }}
        run: |
          set -o pipefail
          if cargo ndk -t x86_64 -p "$ANDROID_API" check --features rquickjs-sys/bindgen -p music \
               > /tmp/x86_64.log 2>&1; then
            echo "::notice title=probe-x86_64::PASS"
          else
            echo "::error title=probe-x86_64::FAIL"
          fi
          echo "::notice title=probe-x86_64-shapes::$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/x86_64.log | head -n 30 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=probe-x86_64-tail::$(tail -n 20 /tmp/x86_64.log | tr '\n' '%0A' | head -c 6000)"

      - name: "music via bindgen (armv7-linux-androideabi, --target supplied)"
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: ${{ env.BINDGEN_ARGS_armv7 }}
        run: |
          set -o pipefail
          if cargo ndk -t armeabi-v7a -p "$ANDROID_API" check --features rquickjs-sys/bindgen -p music \
               > /tmp/armv7.log 2>&1; then
            echo "::notice title=probe-armv7::PASS (with --target)"
          else
            echo "::error title=probe-armv7::FAIL (with --target)"
          fi
          echo "::notice title=probe-armv7-shapes::$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/armv7.log | head -n 30 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=probe-armv7-tail::$(tail -n 20 /tmp/armv7.log | tr '\n' '%0A' | head -c 6000)"

      # The landmine, isolated: same crate, same target, cargo-ndk's own arguments (no
      # `--target`). It compiles — and produces 64-bit layouts for a 32-bit ABI.
      - name: "rquickjs-sys alone (armv7, NO --target — cargo-ndk's own args)"
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe-notarget"
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: ${{ env.BINDGEN_ARGS_armv7_notarget }}
        run: |
          set -o pipefail
          if cargo ndk -t armeabi-v7a -p "$ANDROID_API" check --features bindgen -p rquickjs-sys \
               > /tmp/armv7-notarget.log 2>&1; then
            echo "::notice title=probe-armv7-notarget::compiled"
          else
            echo "::error title=probe-armv7-notarget::FAILED"
          fi
          echo "::notice title=probe-armv7-notarget-shapes::$(grep -E '(PROBE_TARGET|^error)' /tmp/armv7-notarget.log | head -n 20 | tr '\n' '%0A' | head -c 6000)"

      # Which native crates got far enough to produce build artifacts. This is the §1c
      # question the first gate could not answer.
      - name: Which native crates built
        if: always()
        run: |
          for pair in aws-lc-sys:aws_lc_sys aws-lc-rs:aws_lc_rs ring:ring \
                      libsqlite3-sys:libsqlite3_sys opusic-sys:opusic_sys \
                      rquickjs-sys:rquickjs_sys; do
            name=${pair%%:*}; dir=${pair##*:}
            hit=$(find rust/target -type d -name "${dir}-*" 2>/dev/null | head -n 1)
            if [ -n "$hit" ]; then echo "::notice title=probe-built::${name}: artifacts present"
            else echo "::notice title=probe-built::${name}: NO artifacts"; fi
          done

      # The shapes side by side. This is the whole point of the dump.
      - name: Compare generated layouts
        if: always()
        run: |
          out=""
          for f in /tmp/probe/bindings-*.rs /tmp/probe-notarget/bindings-*.rs; do
            [ -f "$f" ] || continue
            label=$(basename "$(dirname "$f")")/$(basename "$f" .rs)
            line=$(grep -m1 "^pub type size_t" "$f" | tr -d '\r')
            nan=$(grep -c "define JS_NAN_BOXING 1" "$f")
            jsval=$(grep -m1 "^pub type JSValue = " "$f")
            union=$(grep -c "^pub union JSValueUnion" "$f")
            out="${out}${label}: size_t=[${line}] nan_boxing=${nan} jsvalue_union=${union} ${jsval}%0A"
          done
          [ -n "$out" ] || out="no bindings dumped"
          echo "::notice title=probe-layouts::$out"

      - name: Verdict
        if: always()
        run: |
          echo "::notice title=probe-verdict::read probe-locked, probe-lock-added, probe-aarch64, probe-x86_64, probe-armv7, probe-armv7-notarget, probe-layouts, probe-built"

# WP-1 experiment, NOT the fix. Three questions, answered by building the real thing:
#   A. Does `rquickjs-sys`'s `bindgen` feature plus a patched build.rs actually compile
#      `music` for the three Android ABIs?
#   B. Do bindgen-generated bindings differ per ABI, or is one layout enough?
#   C. Does the Android build get far enough to reach aws-lc-sys / libsqlite3-sys /
#      opusic-sys, which the first gate never reached?
#
# It touches nothing in the repository's Rust sources: the `rquickjs-sys` whose build.rs is
# patched is the copy cargo extracted into the registry from crates.io, and the `bindgen`
# feature is turned on from the command line (`--features rquickjs-sys/bindgen`), so
# `Cargo.lock` stays untouched. Both are why this is a probe and not the patch.
#
# Everything is reported through annotations: job logs and artifacts cannot be read back
# from the authoring environment, so anything that is not an annotation is lost.
name: wp1-rquickjs-probe

on:
  push:
    branches: ["wp-1-rquickjs-fix"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_REVISION: "27.2.12479018"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
  NDK_SHA256: "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc"
  CARGO_NDK_VERSION: "3.5.4"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup target list --installed | grep android

      - name: Install Android NDK r27c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk"
          archive="$RUNNER_TEMP/ndk/android-ndk-r27c-linux.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$NDK_URL"
          echo "${NDK_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          ndk_path="$RUNNER_TEMP/ndk/android-ndk-r27c"
          actual=$(sed -n 's/^Pkg\.Revision *= *//p' "$ndk_path/source.properties")
          echo "::notice title=ndk::Pkg.Revision=$actual"
          [ "$actual" = "$NDK_REVISION" ] || { echo "::error title=ndk::revision mismatch"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm clang libclang-dev pkg-config perl golang-go || true
          echo "libclang: $(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -n 3 | tr '\n' ' ')"
          echo "clang: $(clang --version | head -n 1)"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked || true
          cargo ndk --version || true

      # Fetch the graph without building, so the registry copy of rquickjs-sys exists and
      # can be patched. `--features` is not needed to fetch.
      - name: Fetch dependencies
        working-directory: rust
        run: |
          cargo fetch --locked 2>&1 | tail -n 3
          ls -d "$HOME"/.cargo/registry/src/*/rquickjs-sys-0.12.2 > /tmp/rqjs-dir || true
          echo "::notice title=probe-rqjs-dir::$(cat /tmp/rqjs-dir 2>/dev/null || echo MISSING)"
          ls "$(cat /tmp/rqjs-dir 2>/dev/null)" 2>/dev/null | head -n 20 || true
          ls "$(cat /tmp/rqjs-dir 2>/dev/null)/quickjs" 2>/dev/null | head -n 20 || true

      # Enabling `bindgen` makes `rquickjs-sys` depend on `bindgen 0.72` + `clang-sys`.
      # If those are not already in Cargo.lock, `--locked` fails here — which is itself the
      # answer to "can the fix land without regenerating the lockfile?".
      - name: Does --locked survive enabling the bindgen feature?
        working-directory: rust
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a check --features rquickjs-sys/bindgen -p music --locked 2>&1 | tail -n 20; then
            echo "::notice title=probe-locked::LOCKED OK — bindgen deps already resolved"
          else
            echo "::error title=probe-locked::LOCKED FAILED — see probe-locked-tail"
          fi

      - name: Patch registry copy of rquickjs-sys (probe only)
        run: |
          set -euo pipefail
          d=$(cat /tmp/rqjs-dir 2>/dev/null || true)
          [ -n "$d" ] || { echo "::error title=probe-patch::registry copy not found"; exit 0; }
          chmod -R u+w "$d"
          if python3 scripts/wp1-probe-rquickjs.py "$d/build.rs"; then
            echo "::notice title=probe-patch::patched $(basename "$d")"
          else
            echo "::error title=probe-patch::anchor not found — rquickjs-sys build.rs changed"
          fi
          echo "::notice title=probe-quickjs-src::$(ls "$d/quickjs" 2>/dev/null | head -n 5 | tr '\n' ' ')"

      # The main event: real build, three ABIs, bindgen on, host-vs-target clamp disabled.
      - name: Cross-compile music with bindgen (aarch64)
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a check --features rquickjs-sys/bindgen -p music --locked \
               > /tmp/aarch64.log 2>&1; then
            echo "::notice title=probe-aarch64::PASS"
          else
            echo "::error title=probe-aarch64::FAIL"
          fi
          body=$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/aarch64.log | head -n 30 | tr '\n' '%0A' | head -c 6000)
          echo "::notice title=probe-aarch64-shapes::$body"
          tail=$(tail -n 25 /tmp/aarch64.log | tr '\n' '%0A' | head -c 6000)
          echo "::error title=probe-aarch64-tail::$tail"

      - name: Cross-compile music with bindgen (armv7)
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
        run: |
          set -o pipefail
          if cargo ndk -t armeabi-v7a check --features rquickjs-sys/bindgen -p music --locked \
               > /tmp/armv7.log 2>&1; then
            echo "::notice title=probe-armv7::PASS"
          else
            echo "::error title=probe-armv7::FAIL"
          fi
          body=$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/armv7.log | head -n 30 | tr '\n' '%0A' | head -c 6000)
          echo "::notice title=probe-armv7-shapes::$body"
          tail=$(tail -n 25 /tmp/armv7.log | tr '\n' '%0A' | head -c 6000)
          echo "::error title=probe-armv7-tail::$tail"

      - name: Cross-compile music with bindgen (x86_64)
        working-directory: rust
        env:
          PROBE_HOST_BINDGEN: "1"
          PROBE_DUMP_DIR: "/tmp/probe"
        run: |
          set -o pipefail
          if cargo ndk -t x86_64 check --features rquickjs-sys/bindgen -p music --locked \
               > /tmp/x86_64.log 2>&1; then
            echo "::notice title=probe-x86_64::PASS"
          else
            echo "::error title=probe-x86_64::FAIL"
          fi
          body=$(grep -E '(PROBE_TARGET|^error|warning: rquickjs)' /tmp/x86_64.log | head -n 30 | tr '\n' '%0A' | head -c 6000)
          echo "::notice title=probe-x86_64-shapes::$body"
          tail=$(tail -n 25 /tmp/x86_64.log | tr '\n' '%0A' | head -c 6000)
          echo "::error title=probe-x86_64-tail::$tail"

      # Which native crates got far enough to produce build artifacts. This is the §1c
      # question the first gate could not answer.
      - name: Which native crates built
        if: always()
        run: |
          for pair in aws-lc-sys:aws_lc_sys aws-lc-rs:aws_lc_rs ring:ring \
                      libsqlite3-sys:libsqlite3_sys opusic-sys:opusic_sys \
                      rquickjs-sys:rquickjs_sys quickjs:libquickjs; do
            name=${pair%%:*}; dir=${pair##*:}
            hit=$(find rust/target -type d -name "${dir}-*" 2>/dev/null | head -n 1)
            if [ -n "$hit" ]; then echo "::notice title=probe-built::${name}: artifacts present"
            else echo "::notice title=probe-built::${name}: NO artifacts"; fi
          done

      # Shapes across ABIs, side by side, so one annotation answers "does one layout fit all".
      - name: Compare generated layouts across ABIs
        if: always()
        run: |
          out=""
          for f in /tmp/probe/bindings-*.rs; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" .rs)
            size=$(stat -c%s "$f")
            line=$(grep -m1 "^pub type size_t" "$f" | tr -d '\r')
            nan=$(grep -c "JS_NAN_BOXING" "$f")
            jsval=$(grep -m1 "^pub type JSValue = " "$f")
            out="${out}${abi}:${size}B size_t=[${line}] nan_boxing_hits=${nan} ${jsval}%0A"
          done
          [ -n "$out" ] || out="no bindings dumped"
          echo "::notice title=probe-layouts::$out"
          for f in /tmp/probe/bindings-*.rs; do
            [ -f "$f" ] || continue
            echo "::notice title=probe-head $(basename "$f")::$(head -n 3 "$f" | tr '\n' ' ' | head -c 300)"
          done

      - name: Verdict
        if: always()
        run: |
          echo "::notice title=probe-verdict::see probe-aarch64 / probe-armv7 / probe-x86_64, probe-locked, probe-layouts, probe-built"

# Verifies that the vendored `music` crate cross-compiles for the three Android ABIs.
#
# `music` is not in `build.yml`'s matrix: the shipped core is `mobile-core`, which does not
# depend on `music` yet. Since `rquickjs-sys` has no Android bindings (docs/AUDIT.md §12a),
# a change that breaks the Android build of `music` would otherwise be invisible until the
# day `music` is wired in. This workflow is that canary.
#
# It checks, all through annotations because logs and artifacts are not readable from the
# authoring environment:
#   - the committed rust/Cargo.lock is complete (`cargo metadata --locked`);
#   - `music` builds for aarch64-linux-android, x86_64-linux-android and
#     armv7-linux-androideabi;
#   - the C crates that have no Rust bindings (aws-lc-sys, libsqlite3-sys, opusic-sys)
#     produce artifacts, i.e. the build reaches them;
#   - the generated layouts match the ABI (32-bit `size_t`, NaN-boxed `JSValue`).
#
# `--target` is supplied to bindgen explicitly in every step. cargo-ndk exports
# BINDGEN_EXTRA_CLANG_ARGS_<triple> as `--sysroot=... -I...` with no `--target=`, in every
# released version 3.5.4 through 4.1.2 (fixed on master only, commit ee7329a). Without it
# clang binds the host layout, and armv7 would silently be built against 64-bit types.
name: android-music

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/vendor/**"
      - ".github/workflows/android-music.yml"

permissions:
  contents: read

env:
  NDK_REVISION: "27.2.12479018"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
  NDK_SHA256: "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc"
  CARGO_NDK_VERSION: "3.5.4"
  ANDROID_API: "21"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bindings:
    runs-on: ubuntu-latest
    # The dependency graph has to be resolved, fetched and compiled from scratch.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Started before the NDK download so its ~20 minute build overlaps it.
      - name: Install cargo-ndk (background)
        run: |
          nohup cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked \
            > /tmp/cargo-ndk-install.log 2>&1 &

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup target list --installed | grep android

      - name: Install Android NDK r27c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk"
          archive="$RUNNER_TEMP/ndk/android-ndk-r27c-linux.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$NDK_URL"
          echo "${NDK_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/ndk"
          ndk_path="$RUNNER_TEMP/ndk/android-ndk-r27c"
          actual=$(sed -n 's/^Pkg\.Revision *= *//p' "$ndk_path/source.properties")
          echo "::notice title=ndk::Pkg.Revision=$actual"
          [ "$actual" = "$NDK_REVISION" ] || { echo "::error title=ndk::revision mismatch"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm clang libclang-dev pkg-config perl golang-go || true
          echo "::notice title=host-tools::$(clang --version | head -n 1) | libclang: $(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | head -n 2 | tr '\n' ' ')"

      - name: Wait for cargo-ndk
        run: |
          deadline=$((SECONDS + 1500))
          while ! command -v cargo-ndk >/dev/null 2>&1; do
            if [ $SECONDS -ge "$deadline" ]; then
              echo "::error title=cargo-ndk::still missing after 25 minutes"
              tail -n 20 /tmp/cargo-ndk-install.log || true
              exit 1
            fi
            sleep 10
          done
          echo "::notice title=cargo-ndk::$(cargo ndk --version 2>&1 | tail -n 1)"

      # The patch is committed now, together with the lockfile it requires, so this run
      # proves the committed state rather than a runtime edit. Committing them apart would
      # have broken every --locked job in between: the vendored crate puts bindgen 0.72 and
      # clang-sys in the graph, and the lock that records them has to land in the same
      # commit. The job no longer needs to touch Cargo.toml.
      # Proves the committed lockfile is complete: --locked must fail if it is not, which
      # is the same gate every other job uses.
      - name: Resolve the lockfile with the bindgen graph
        working-directory: rust
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          # --locked first: if the committed lockfile is missing anything the vendored crate
          # needs, this fails and nothing after it can produce a misleading pass.
          if cargo metadata --format-version 1 --locked > /tmp/metadata.json 2> /tmp/resolve.log; then
            echo "::notice title=resolve::ok (cargo metadata --locked)"
          else
            echo "::error title=resolve::FAILED with --locked — see resolve-tail"
          fi
          echo "::notice title=resolve-tail::$(tail -n 20 /tmp/resolve.log | tr '\n' '%0A' | head -c 6000)"
          # `diff` exits 1 when it finds differences, and this step runs under bash -e with
          # pipefail, so the comparison must not be allowed to abort the step.
          added=$(diff <(grep '^name = ' /tmp/Cargo.lock.before) <(grep '^name = ' Cargo.lock) 2>/dev/null | grep '^>' | sed 's/^> name = //' | tr -d '"' | sort -u | tr '\n' ' ' || true)
          echo "::notice title=lock-added::${added:-none}"
          echo "::notice title=lock-diffstat::$(git diff --stat Cargo.lock | tr '\n' ' ' || true)"
          if git diff --quiet Cargo.lock; then
            echo "::notice title=lock-stable::committed lockfile is already complete"
          else
            echo "::error title=lock-stable::committed lockfile changed under --locked=false — re-commit it"
          fi
          echo "::notice title=lock-rqjs::$(grep -A3 '^name = "rquickjs-sys"' Cargo.lock | tr '\n' ' ' || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error

      # The per-ABI clang arguments. `--target` is the part cargo-ndk leaves out.
      - name: Compute bindgen clang args per ABI
        run: |
          set -euo pipefail
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "BINDGEN_ARGS_arm64=--target=aarch64-linux-android${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/aarch64-linux-android"
            echo "BINDGEN_ARGS_armv7=--target=armv7a-linux-androideabi${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/arm-linux-androideabi"
            echo "BINDGEN_ARGS_x86_64=--target=x86_64-linux-android${ANDROID_API} --sysroot=${sysroot} -I${sysroot}/usr/include/x86_64-linux-android"
          } >> "$GITHUB_ENV"
          grep BINDGEN_ARGS "$GITHUB_ENV" | sed 's/^/::notice title=args::/'

      # One ABI per step so a failure names its own ABI. `check` builds the build scripts
      # and the C, so the bindings are generated exactly as a release build would.
      - name: "music for aarch64-linux-android"
        working-directory: rust
        timeout-minutes: 15
        env:
          RQUICKJS_SYS_DUMP_BINDINGS: /tmp/bindings
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: ${{ env.BINDGEN_ARGS_arm64 }}
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a -p "$ANDROID_API" check -p music > /tmp/aarch64.log 2>&1; then
            echo "::notice title=abi-aarch64::PASS"
          else
            echo "::error title=abi-aarch64::FAIL"
          fi
          echo "::notice title=abi-aarch64-notes::$(grep -E '(warning: layout|cargo:warning=dumped|^error|warning: rquickjs)' /tmp/aarch64.log | head -n 20 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=abi-aarch64-tail::$(tail -n 20 /tmp/aarch64.log | tr '\n' '%0A' | head -c 6000)"

      - name: "music for x86_64-linux-android"
        working-directory: rust
        timeout-minutes: 15
        env:
          RQUICKJS_SYS_DUMP_BINDINGS: /tmp/bindings
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android: ${{ env.BINDGEN_ARGS_x86_64 }}
        run: |
          set -o pipefail
          if cargo ndk -t x86_64 -p "$ANDROID_API" check -p music > /tmp/x86_64.log 2>&1; then
            echo "::notice title=abi-x86_64::PASS"
          else
            echo "::error title=abi-x86_64::FAIL"
          fi
          echo "::notice title=abi-x86_64-notes::$(grep -E '(warning: layout|cargo:warning=dumped|^error|warning: rquickjs)' /tmp/x86_64.log | head -n 20 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=abi-x86_64-tail::$(tail -n 20 /tmp/x86_64.log | tr '\n' '%0A' | head -c 6000)"

      # armv7 is its own crate copy on purpose: cargo will not rebuild a build script twice
      # in one target dir, so a second armv7 pass with different clang args would silently
      # reuse the first pass's output. Separate target dir, separate invocation.
      - name: "music for armv7-linux-androideabi"
        working-directory: rust
        timeout-minutes: 15
        env:
          RQUICKJS_SYS_DUMP_BINDINGS: /tmp/bindings
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: ${{ env.BINDGEN_ARGS_armv7 }}
          CARGO_TARGET_DIR: target-armv7
        run: |
          set -o pipefail
          if cargo ndk -t armeabi-v7a -p "$ANDROID_API" check -p music > /tmp/armv7.log 2>&1; then
            echo "::notice title=abi-armv7::PASS"
          else
            echo "::error title=abi-armv7::FAIL"
          fi
          echo "::notice title=abi-armv7-notes::$(grep -E '(warning: layout|cargo:warning=dumped|^error|warning: rquickjs)' /tmp/armv7.log | head -n 20 | tr '\n' '%0A' | head -c 6000)"
          echo "::error title=abi-armv7-tail::$(tail -n 20 /tmp/armv7.log | tr '\n' '%0A' | head -c 6000)"

      - name: Package the bindings
        if: always()
        run: |
          # Fallback: if the dump variable did not reach a build script for some ABI, take
          # bindgen's own output from the target directory instead. Sanity-check every file
          # first: a bindings file with no `pub fn JS_` in it is the 3-line stub that
          # upstream's non-bindgen path writes, not generated bindings (that is how run
          # 44776546926 "succeeded" while generating nothing).
          if [ ! -d /tmp/bindings ] || [ -z "$(ls -A /tmp/bindings 2>/dev/null)" ]; then
            mkdir -p /tmp/bindings
            for f in $(find rust/target rust/target-armv7 -path '*rquickjs-sys-*/out/bindings.rs' 2>/dev/null); do
              triple=$(echo "$f" | sed -E 's#^rust/(target|target-armv7)/([^/]+)/.*#\2#')
              cp "$f" "/tmp/bindings/fallback-${triple}.rs"
              echo "::notice title=binding-fallback::copied $f as fallback-${triple}.rs"
            done
          fi
          for f in /tmp/bindings/*.rs; do
            [ -f "$f" ] || continue
            n=$(grep -c "pub fn JS_" "$f" || true)
            if [ "${n:-0}" -lt 50 ]; then
              echo "::error title=bindings-stub::$(basename "$f") has only ${n} externs — not generated bindings"
            else
              echo "::notice title=bindings-ok::$(basename "$f") ${n} externs, $(stat -c%s "$f") bytes"
            fi
          done
          ls -la /tmp/bindings 2>/dev/null || echo "no bindings directory"
          cd /tmp && if [ -d bindings ] && [ -n "$(ls -A bindings 2>/dev/null)" ]; then
            zip -q bindings.zip bindings/*.rs && ls -l bindings.zip
          else
            echo "::error title=bindings::nothing captured"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bindings
          path: /tmp/bindings.zip
          if-no-files-found: warn

      # Which native crates produced artifacts. This is the §1c question the first gate
      # could not answer, because cargo stops at the first hard error.
      - name: Which native crates built
        if: always()
        run: |
          # Directory names use the package name verbatim, hyphens included.
          for pair in aws-lc-sys:aws-lc-sys aws-lc-rs:aws-lc-rs ring:ring \
                      libsqlite3-sys:libsqlite3-sys opusic-sys:opusic-sys \
                      rquickjs-sys:rquickjs-sys; do
            name=${pair%%:*}; dir=${pair##*:}
            hit=$(find rust/target rust/target-armv7 -type d -name "${dir}-*" 2>/dev/null | head -n 1)
            if [ -n "$hit" ]; then echo "::notice title=built::${name}: artifacts present"
            else echo "::notice title=built::${name}: NO artifacts"; fi
          done

      # The layouts side by side: the measurement that decides whether one shared file can
      # serve all three ABIs or each needs its own.
      - name: Compare generated layouts
        if: always()
        run: |
          out=""
          for f in /tmp/bindings/*.rs; do
            [ -f "$f" ] || continue
            t=$(basename "$f" .rs)
            size=$(stat -c%s "$f")
            # `|| true` throughout: `run:` is bash -e, and a grep that finds nothing
            # returns 1, which killed this step in run 44777481631 before it printed
            # anything.
            line=$(grep -m1 "^pub type size_t" "$f" | tr -d '\r' || true)
            nan=$(grep -c "define JS_NAN_BOXING 1" "$f" || true)
            jsval=$(grep -m1 "^pub type JSValue = " "$f" || true)
            union=$(grep -c "^pub union JSValueUnion" "$f" || true)
            out="${out}${t} (${size}B): size_t=[${line}] nan_boxing=${nan} jsvalue_union=${union} ${jsval}%0A"
          done
          [ -n "$out" ] || out="no bindings dumped"
          echo "::notice title=layouts::$out"

      # The lockfile cannot be resolved offline, and artifacts cannot be downloaded from
      # the authoring environment, so the diff is published as annotations. Three chunks of
      # at most 20 KB each stay well inside the 64 KB annotation limit.
      - name: Publish the lockfile diff
        if: always()
        working-directory: rust
        run: |
          git diff Cargo.lock > /tmp/lock.diff || true
          echo "::notice title=lock-diff-size::$(wc -l < /tmp/lock.diff) lines, $(wc -c < /tmp/lock.diff) bytes"
          for n in 1 2 3; do
            from=$(( (n - 1) * 20 + 1 ))
            chunk=$(sed -n "${from},$(( from + 19999 ))p" /tmp/lock.diff | tr '\n' '%0A')
            # `|| true`: an empty diff is the normal, good case now, and `[ -n "" ] && ...`
            # is the last command of the loop body, so bash -e would fail the step on it.
            if [ -n "$chunk" ]; then echo "::warning title=lock-diff-$n::$chunk"; fi
          done

      - name: Verdict
        if: always()
        run: |
          echo "::notice title=verdict::read resolve, lock-added, abi-aarch64, abi-x86_64, abi-armv7, layouts, built. Artifacts: cargo-lock and bindings."

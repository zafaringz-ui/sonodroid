name: build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # `--locked` below fails fast if the committed lockfile is out of date, so
      # this step only has to prove the file is tracked and not git-ignored.
      - name: Verify committed Cargo lockfile
        shell: bash
        run: |
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "::error::rust/Cargo.lock is not tracked; commit it before relying on --locked."
            exit 1
          fi
          if git check-ignore -q Cargo.lock; then
            echo "::error::Cargo.lock is listed in .gitignore; remove that entry."
            exit 1
          fi
          echo "Using the committed Cargo.lock."

      - name: Formatting
        shell: bash
        run: |
          mkdir -p ../ci-logs
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee ../ci-logs/cargo-fmt.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of formatting output:'
            tail -n 100 ../ci-logs/cargo-fmt.log
            exit "$status"
          }

      # Generate a reviewable patch without making a failing check pass or committing it.
      - name: Generate formatting patch
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee ../ci-logs/cargo-fmt-apply.log
          git diff --binary -- . > ../ci-logs/rustfmt.patch

      - name: Unit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p ../ci-logs
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee ../ci-logs/cargo-test.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of cargo test output:'
            tail -n 100 ../ci-logs/cargo-test.log
            exit "$status"
          }

      - name: Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p ../ci-logs
          set -o pipefail
          cargo clippy --locked --workspace --all-targets -- -D clippy::all 2>&1 | tee ../ci-logs/cargo-clippy.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of clippy output:'
            tail -n 100 ../ci-logs/cargo-clippy.log
            exit "$status"
          }

      - name: Upload Cargo lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: rust/Cargo.lock
          if-no-files-found: error

      - name: Preserve Cargo lockfile
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p ../ci-logs
          if [ -f Cargo.lock ]; then cp Cargo.lock ../ci-logs/Cargo.lock; fi

      - name: Upload Rust logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-logs
          path: ci-logs/
          if-no-files-found: warn

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug
        shell: bash
        run: |
          mkdir -p ../ci-logs
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../ci-logs/gradle-assemble.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of Gradle assemble output:'
            tail -n 100 ../ci-logs/gradle-assemble.log
            exit "$status"
          }

      - name: Unit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p ../ci-logs
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee ../ci-logs/gradle-test.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of Gradle test output:'
            tail -n 100 ../ci-logs/gradle-test.log
            exit "$status"
          }

      - name: Upload Gradle logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: ci-logs/
          if-no-files-found: warn

      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # Builds the real `libsonora_core.so` for three ABIs, generates the UniFFI Kotlin
  # bindings from that library, and packages a `-Psonora.rust=true` debug APK.
  #
  # This job proves the native library compiles and reaches the APK. It does NOT
  # prove the library loads on a device (no emulator here) and does NOT make the
  # data real (the catalogue still serves fixtures).
  android-native:
    name: Android native
    runs-on: ubuntu-latest
    env:
      # Pinned so the native job cannot drift from the Gradle job's tooling.
      NDK_VERSION: "27.2.12479018"
      CARGO_NDK_VERSION: "3.5.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for Android
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          rustup target list --installed | grep android

      # Pinned by commit SHA: this action takes the NDK tag from the tag name, so a
      # tag would have to contain "r27c" and Google's archive only carries "r27".
      # The exact revision is passed explicitly through `ndk-version` instead.
      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: "true"
      - name: Export ANDROID_NDK_HOME
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          if [ -f "$NDK_PATH/source.properties" ]; then
            grep '^Pkg.Revision' "$NDK_PATH/source.properties"
          fi

      # `--locked` here pins cargo-ndk itself; it is unrelated to the project lockfile.
      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi
          cargo ndk --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-native

      - name: Cross-compile the core for three ABIs
        working-directory: rust
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/core-bridge/src/main/jniLibs \
            build --release --locked -p mobile-core 2>&1 | tee ../ci-logs/cargo-ndk.log

      - name: Assert the three shared libraries exist
        run: |
          set -euo pipefail
          jni=android/core-bridge/src/main/jniLibs
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="$jni/$abi/libsonora_core.so"
            if [ ! -f "$so" ]; then
              echo "::error::Missing shared library for $abi at $so"
              missing=1
            else
              printf '%s  %10s bytes  %s\n' "$abi" "$(stat -c%s "$so")" "$so"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more ABIs did not produce libsonora_core.so." >&2
            exit 1
          fi
          echo
          echo "Shared library sizes:"
          find "$jni" -name 'libsonora_core.so' -exec ls -lh {} \;

      # Generated from the freshly built library, so the bindings always match the
      # code that ships. `--features cli` pulls in `uniffi_bindgen` at exactly the
      # crate's 0.28.3 version because it is the same dependency graph.
      - name: Generate UniFFI Kotlin bindings from the built library
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cargo run --manifest-path rust/Cargo.toml \
            -p mobile-core --features cli --bin uniffi-bindgen -- \
            generate \
            --library android/core-bridge/src/main/jniLibs/arm64-v8a/libsonora_core.so \
            --language kotlin \
            --config rust/crates/mobile-core/uniffi.toml \
            --out-dir android/core-bridge/src/generated 2>&1 | tee ci-logs/uniffi-bindgen.log
          echo
          echo "Generated files:"
          find android/core-bridge/src/generated -name '*.kt' -exec wc -l {} \;

      - name: Verify the adapter's expected class is present in the bindings
        run: |
          set -euo pipefail
          f=android/core-bridge/src/generated/dev/sonora/core/ffi/sonora_core.kt
          if [ ! -f "$f" ]; then
            echo "::error::Expected generated bindings at $f"
            find android/core-bridge/src/generated -name '*.kt'
            exit 1
          fi
          grep -n "public object SonoraCore\|public interface CoreListener\|public interface TokenMinter" "$f"

      - name: Build the Rust-backed debug APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          gradle :app:assembleDebug -Psonora.rust=true --stacktrace 2>&1 | tee ../ci-logs/gradle-rust-assemble.log || {
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then status=1; fi
            echo 'Last 100 lines of Gradle output:'
            tail -n 100 ../ci-logs/gradle-rust-assemble.log
            exit "$status"
          }

      # No device here, so this is the closest thing to "did it package?".
      - name: Smoke-check native libraries inside the APK
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          echo
          if command -v unzip >/dev/null 2>&1; then
            unzip -l "$apk" | grep 'lib/' || true
            echo
            for abi in arm64-v8a armeabi-v7a x86_64; do
              if ! unzip -l "$apk" | grep -q "lib/$abi/libsonora_core.so"; then
                echo "::error::APK is missing lib/$abi/libsonora_core.so"
                exit 1
              fi
              echo "OK  lib/$abi/libsonora_core.so"
            done
          else
            echo "::error::unzip is unavailable; cannot inspect the APK"
            exit 1
          fi

      - name: Upload the Rust-backed APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-rust-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload native logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-native-logs
          path: ci-logs/
          if-no-files-found: warn

name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::all

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper is committed yet (the project was scaffolded without a JVM);
      # the action supplies Gradle 8.10.2 and the dependency cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Unit tests
        run: gradle :core-bridge:testDebugUnitTest --stacktrace

      - name: Upload APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

# TEMPORARY. Deleted before PR #14 is final.
#
# The authoring environment has no cargo, so rust/Cargo.lock was seeded by merging
# the previous lock with upstream's at c0b501c. That merge cannot know the exact
# resolution Cargo will pick, and every other job runs `--locked`, which would fail on
# the first discrepancy. This workflow lets a real Cargo resolve once and commits the
# result, so the committed lock is Cargo's own output rather than a hand-merge.
name: lock-resolve

on:
  workflow_dispatch:
  push:
    branches: ["vendor/music-wiring"]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor/music-wiring

      - uses: dtolnay/rust-toolchain@stable

      # No --locked on purpose: the point is to let Cargo settle the graph.
      - name: Resolve
        working-directory: rust
        run: |
          cargo metadata --format-version 1 > /dev/null
          echo "::notice title=lock-resolve::cargo metadata completed without --locked"

      - name: Report whether the lock changed
        working-directory: rust
        run: |
          if [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "::notice title=lock-unchanged::Cargo.lock was already correct; nothing to commit"
          else
            git --no-pager diff --stat Cargo.lock || true
            echo "::notice title=lock-changed::Cargo.lock differs from the seeded merge; committing Cargo's version"
          fi

      - name: Commit the resolved lock
        working-directory: rust
        run: |
          if [ -z "$(git status --porcelain Cargo.lock)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: resolve rust/Cargo.lock for the vendored workspace members"
          git push

      # If cargo metadata failed, the lock above is unchanged and this stays quiet;
      # the failure itself is mirrored into an annotation because job logs are not
      # readable from the authoring environment.
      - name: Mirror any cargo error into annotations
        if: failure()
        working-directory: rust
        run: |
          echo "::error title=lock-resolve-failed::cargo metadata failed; see the step log"
          cargo metadata --format-version 1 2>&1 | head -n 40 | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=cargo::$line"
          done || true

# TEMPORARY. Deleted before PR #14 is final.
#
# Answers one question: does the UNMODIFIED vendored `music` crate compile on host
# Linux with --locked? Nothing here fixes anything; a failure is a recorded result.
# Results are emitted as ::notice / ::error annotations because job logs cannot be
# read from the authoring environment.
name: music-baseline

on:
  workflow_dispatch:
  push:
    branches: ["vendor/music-wiring"]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor/music-wiring

      - uses: dtolnay/rust-toolchain@stable

      # Host Linux build of a crate that pulls cpal/alsa/pulseaudio: the native audio
      # headers and pkg-config are needed for their -sys crates to probe.
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libpulse-dev cmake nasm clang libclang-dev
          echo "::notice title=apt::installed pkg-config libasound2-dev libpulse-dev cmake nasm clang libclang-dev"

      - name: cargo metadata --locked
        working-directory: rust
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null 2> /tmp/meta.err; then
            echo "::notice title=metadata-locked::cargo metadata --locked PASSED"
          else
            echo "::error title=metadata-locked::cargo metadata --locked FAILED"
            head -n 30 /tmp/meta.err | while IFS= read -r l; do
              [ -z "$l" ] && continue
              echo "::error title=metadata::$l"
            done || true
            exit 1
          fi

      - name: Baseline cargo check -p music --locked
        working-directory: rust
        run: |
          set -o pipefail
          if cargo check -p music --locked 2>&1 | tee /tmp/music-check.log; then
            echo "::notice title=baseline::cargo check -p music --locked PASSED"
          else
            echo "::notice title=baseline::cargo check -p music --locked FAILED (baseline result, nothing is fixed here)"
            # First 40 error lines, grouped by the crate that emitted them.
            sed -n 's/^error\[\(.*\)\]/error[\1]/p' /tmp/music-check.log | head -n 40 | while IFS= read -r l; do
              echo "::error title=baseline-error::$l"
            done || true
            grep -E '^(error|  -->)' /tmp/music-check.log | head -n 40 | while IFS= read -r l; do
              echo "::error title=baseline-detail::$l"
            done || true
            # Which crate each error belongs to, via the file path in the diagnostic.
            grep -oE '(vendor/sonora/crates/[a-z]+|crates/mobile-core)' /tmp/music-check.log | sort | uniq -c | sort -rn | head -n 10 | while IFS= read -r l; do
              echo "::error title=baseline-by-crate::$l"
            done || true
            exit 1
          fi

      - name: Always emit an end marker
        if: always()
        run: echo "::notice title=baseline::finished"

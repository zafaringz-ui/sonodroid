org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Off: a dependency-resolution failure is then reported as itself, instead of being
# wrapped in a configuration-cache serialization error that hides the real cause.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Set to true (or pass -Psonora.rust=true) once rust/ has been cross-compiled and
# the UniFFI Kotlin bindings generated; see docs/BRIDGE.md.
sonora.rust=false

[workspace]
resolver = "2"
members = ["crates/mobile-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/zafaringz-ui/sonodroid"
rust-version = "1.85"

[workspace.dependencies]
uniffi = "0.28.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
once_cell = "1.20"
async-trait = "0.1"
tokio = { version = "1.42", features = ["rt-multi-thread", "time", "sync"] }

# Release profile from the plan: small, fast, no panic unwinding across the FFI.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

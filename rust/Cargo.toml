[workspace]
resolver = "2"
members = ["crates/mobile-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/zafaringz-ui/sonodroid"
rust-version = "1.85"

[workspace.dependencies]
uniffi = "0.28.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
once_cell = "1.20"
async-trait = "0.1"
tokio = { version = "1.42", features = ["rt-multi-thread", "time", "sync"] }

# Release profile from the plan: small, fast, no panic unwinding across the FFI.
#
# `panic = "abort"` interacts with UniFFI and is deliberately kept:
#  * UniFFI 0.28.3 catches panics in `uniffi_core::ffi::rustcalls::rust_call_*`
#    via `std::panic::catch_unwind` and reports them to Kotlin as
#    `UnexpectedError` with the panic message. With `panic = "abort"` there is
#    nothing to catch, so a panic aborts the process instead of surfacing as a
#    Kotlin exception. That is acceptable for the current core, which has no
#    `unwrap`/index panics on the FFI path, and it keeps the binary small.
#  * If the core later performs fallible work that can panic (parsing untrusted
#    provider JSON, slice indexing on network data), remove this line: unwinding
#    is required for UniFFI to turn a panic into a Kotlin exception rather than a
#    crash. `-Cpanic=abort` also makes `catch_unwind` a no-op, so this is not
#    something the bindings can compensate for.
#  * `strip = "symbols"` is kept as the plan specifies. It is safe here, but only
#    because UniFFI library mode needs the `uniffi_*` metadata from the ELF
#    **static** symbol table (`elf.syms` in
#    `uniffi_bindgen::macro_metadata::extract` -> `extract_from_elf`). Two things
#    must therefore be true at bindgen time:
#      1. the bindings must be generated from the cargo target directory output,
#         not from a copy that `cargo ndk` post-processed — cargo-ndk 3.x runs an
#         extra host `strip` on the files it copies into the jniLibs output
#         directory, which removes the static table and makes the generator find
#         zero components and write nothing (silently, exit code 0);
#      2. the copy handed to the APK should also skip that strip, or the
#         `uniffi_*` metadata disappears from the shipped library.
#    `cargo ndk --no-strip` covers (2) and generating from target/ covers (1).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

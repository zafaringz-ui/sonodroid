[package]
name = "rquickjs-sys"
version = "0.12.2"
authors = ["Mees Delzenne <mees.delzenne@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "QuickJS bindings for rquickjs"
keywords = ["quickjs", "ecmascript", "javascript", "es6", "es2020"]
categories = ["external-ffi-bindings"]
repository = "https://github.com/DelSkayn/rquickjs.git"

[build-dependencies]
cc = "1"

[build-dependencies.bindgen-rs]
package = "bindgen"
version = "0.72"

[build-dependencies.pretty_env_logger]
version = "0.5"
optional = true

[features]
# Local patch (see VENDORED.md). Upstream switches bindgen on with `bindgen = ["bindgen-rs"]`,
# and that does not work for us: `rquickjs-core` declares this crate with
# `default-features = false`, which overrides any default set here, and nothing in our
# dependency chain can turn the feature on (measured: runs 44762958918, 44776546926).
# So generation is unconditional in build.rs and these features are kept only as no-ops,
# so that a manifest asking for them still resolves.
default = []
bindgen = []

# Debug logging
logging = ["pretty_env_logger"]
# Special case for updating bundled bindings
update-bindings = ["bindgen"]

# Enable QuickJS dumps
dump-bytecode = []
dump-gc = []
dump-gc-free = []
dump-free = []
dump-leaks = []
dump-mem = []
dump-objects = []
dump-atoms = []
dump-shapes = []
dump-module-resolve = []
dump-promise = []
dump-read-object = []

# Disable QuickJS assertions for better performance
disable-assertions = []

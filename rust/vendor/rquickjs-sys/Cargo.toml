[package]
name = "rquickjs-sys"
version = "0.12.2"
authors = ["Mees Delzenne <mees.delzenne@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "QuickJS bindings for rquickjs"
keywords = ["quickjs", "ecmascript", "javascript", "es6", "es2020"]
categories = ["external-ffi-bindings"]
repository = "https://github.com/DelSkayn/rquickjs.git"

[build-dependencies]
cc = "1"

[build-dependencies.bindgen-rs]
package = "bindgen"
version = "0.72"
optional = true

[build-dependencies.pretty_env_logger]
version = "0.5"
optional = true

[features]
# Local patch (see VENDORED.md): `bindgen` is on by default here, because Android is a
# target rquickjs-sys 0.12.2 ships no bindings for. It stays on for every target rather
# than only Android: this manifest cannot see the target, and a per-target conditional is
# not expressible in Cargo.toml. For a host build the crate reuses its own bundled
# bindings instead of running bindgen (build.rs skips generation when TARGET == HOST), so
# the only cost on non-Android targets is that the bindgen build-dependencies are in the
# graph.
default = ["bindgen"]
bindgen = ["bindgen-rs"]

# Debug logging
logging = ["pretty_env_logger"]
# Special case for updating bundled bindings
update-bindings = ["bindgen"]

# Enable QuickJS dumps
dump-bytecode = []
dump-gc = []
dump-gc-free = []
dump-free = []
dump-leaks = []
dump-mem = []
dump-objects = []
dump-atoms = []
dump-shapes = []
dump-module-resolve = []
dump-promise = []
dump-read-object = []

# Disable QuickJS assertions for better performance
disable-assertions = []

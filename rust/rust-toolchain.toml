[toolchain]
# 1.98.1 matches the toolchain vendored upstream builds with (upstream
# rust-toolchain.toml at c0b501c). The vendored crates in rust/vendor/sonora declare
# no rust-version of their own and their dependency graph was resolved against
# 1.98.1, so building them on an older compiler is not a supported configuration.
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

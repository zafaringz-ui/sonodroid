[package]
name = "mobile-core"
description = "Sonora Android core: providers, queue, playback state and auth, exposed over UniFFI"
# Pinned rather than inherited: [workspace.package].version is 0.50.2 for the vendored
# crates, but this crate is our own and its version() API reports CARGO_PKG_VERSION,
# which UniFFI also bakes into the generated metadata. Keeping 0.1.0 means the
# checked-in Kotlin bindings and the UNIFFI_META_* symbol checks stay valid.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sonora_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Enables `cargo run -p mobile-core --features cli --bin uniffi-bindgen`.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
